name: MeasureQuicktest

on:
  workflow_dispatch:

jobs:
  test:
    name: Run quicktest on PR branch
    runs-on: ubuntu-22.04

    steps:
      - name: checkout
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Expose GitHub Actions cache runtime to docker build
        uses: crazy-max/ghaction-github-runtime@v3

      - name: DockerRunQuicktest
        env:
          FINN_DOCKER_BUILD_EXTRA: "--load --cache-from type=gha,scope=finn-quicktest --cache-to type=gha,mode=max,scope=finn-quicktest"
        run: |
          export FINN_ROOT=$(pwd)
          export FINN_BUILD_DIR=/tmp/finn_gha
          export FINN_INST_NAME=finn_gha
          export FINN_SKIP_XRT_DOWNLOAD=1
          export DOCKER_INTERACTIVE=""
          ./run-docker.sh quicktest
